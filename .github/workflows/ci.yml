# CI gate (ADR-0013, [E0-1], [E0-2], [E0-3]). Required status checks on `main`: backend, frontend, secret-scan, image, compose.
# Scanners run as pinned container images rather than third-party actions.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # build = compile + test + integrationTest (Testcontainers, Docker is available on ubuntu runners) + architectureTest
      - run: ./gradlew build --console=plain

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # scan full history, not just the tip
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

  # Dependency scan: npm lockfile (filesystem) and backend jars + OS packages (image).
  image:
    runs-on: ubuntu-latest
    env:
      TRIVY: aquasec/trivy:0.76.1
      TRIVY_ARGS: --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      IMAGE: hms-backend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Dependency scan (repository)
        run: docker run --rm -v "$PWD:/repo" "$TRIVY" fs --scanners vuln $TRIVY_ARGS /repo
      - name: Build backend image
        run: docker build -f infra/docker/backend.Dockerfile -t "$IMAGE" backend
      - name: Scan backend image
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image $TRIVY_ARGS "$IMAGE"

  # [E0-3] acceptance: the Compose dev stack comes up healthy and the proxy routes SPA + /api.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # .env.example ships without values; CI fills in throwaway ones (password random per run).
      - name: Write CI .env
        run: |
          sed -e 's/^HMS_DB_NAME=.*/HMS_DB_NAME=hms/' \
              -e "s/^HMS_DB_PASSWORD=.*/HMS_DB_PASSWORD=$(openssl rand -hex 16)/" \
              -e "s/^HMS_DB_MIGRATION_PASSWORD=.*/HMS_DB_MIGRATION_PASSWORD=$(openssl rand -hex 16)/" \
              -e 's/^HMS_DB_ADMIN_USERNAME=.*/HMS_DB_ADMIN_USERNAME=hms_admin/' \
              -e "s/^HMS_DB_ADMIN_PASSWORD=.*/HMS_DB_ADMIN_PASSWORD=$(openssl rand -hex 16)/" \
              -e 's/^HMS_DB_PORT=.*/HMS_DB_PORT=5432/' \
              -e 's|^HMS_DB_URL=.*|HMS_DB_URL=jdbc:postgresql://localhost:5432/hms|' \
              -e 's/^HMS_SERVER_PORT=.*/HMS_SERVER_PORT=8080/' \
              -e 's/^HMS_PROXY_PORT=.*/HMS_PROXY_PORT=8080/'               -e 's/^HMS_GRAFANA_ADMIN_USERNAME=.*/HMS_GRAFANA_ADMIN_USERNAME=admin/'               -e "s/^HMS_GRAFANA_ADMIN_PASSWORD=.*/HMS_GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 16)/"               -e 's/^HMS_GRAFANA_PORT=.*/HMS_GRAFANA_PORT=3000/' \
              .env.example > .env
          if grep -E '^[A-Z_]+=$' .env; then echo "unset variables above: add them to this step"; exit 1; fi
      - name: Start stack and wait for healthchecks
        run: docker compose -f infra/compose/compose.yml --env-file .env --profile monitoring up -d --build --wait --wait-timeout 300
      - name: Smoke test through the proxy
        run: |
          curl -fsS -o /dev/null http://localhost:8080/
          # Reached Spring Security through the proxy: unauthenticated -> 401 Problem+JSON ([E0-5])
          curl -s -D - -o body.json http://localhost:8080/api/v1/ping | grep -q '^HTTP/1.1 401'
          grep -q '"code":"UNAUTHENTICATED"' body.json
      - name: Prometheus scrapes the API ([E0-7])
        run: |
          for i in $(seq 1 12); do
            docker compose -f infra/compose/compose.yml --env-file .env exec -T prometheus \
              wget -qO- 'http://localhost:9090/api/v1/query?query=up{job="hms-api"}' | grep -q '"value":\[[0-9.]*,"1"\]' && exit 0
            sleep 5
          done
          echo "Prometheus never scraped hms-api successfully"; exit 1
      - if: failure()
        run: docker compose -f infra/compose/compose.yml --env-file .env --profile monitoring logs
      - if: always()
        run: docker compose -f infra/compose/compose.yml --env-file .env --profile monitoring down -v
