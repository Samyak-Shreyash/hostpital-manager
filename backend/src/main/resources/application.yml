# All environment-specific values come from environment variables (see /.env.example).
spring:
  application:
    name: hms
  datasource:
    url: ${HMS_DB_URL:jdbc:postgresql://localhost:5432/hms}
    username: ${HMS_DB_USERNAME:hms_app} # runtime role: DML only (ADR-0015)
    password: ${HMS_DB_PASSWORD:}
  jpa:
    open-in-view: false # ADR-0002
    properties:
      hibernate:
        default_schema: hms # ADR-0003
  flyway:
    # Migrations run as the owner role (ADR-0015); the runtime datasource never has DDL rights.
    user: ${HMS_DB_MIGRATION_USERNAME:hms_owner}
    password: ${HMS_DB_MIGRATION_PASSWORD:}
    schemas: hms # ADR-0003
    default-schema: hms
    create-schemas: true

  session:
    jdbc:
      table-name: hms.spring_session # created by V3 (ADR-0005); never auto-initialised
      initialize-schema: never

server:
  port: ${HMS_SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${HMS_SESSION_IDLE_TIMEOUT:30m} # idle timeout (hld.md section 7)

hms:
  session:
    cookie-secure: ${HMS_SESSION_COOKIE_SECURE:true} # cookie name/flags: SessionCookieConfig

management:
  endpoints:
    web:
      exposure:
        # prometheus is scraped inside the network only; the reverse proxy does not route /actuator ([E0-7]).
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: hms
    distribution:
      percentiles-histogram:
        http.server.requests: true # p95 latency in Grafana (ADR-0014)

# JSON logs (ADR-0014): module + correlationId on every line, PHI redaction as defence in depth.
logging:
  structured:
    format:
      console: logstash
    json:
      customizer: com.hms.shared.logging.HmsJsonLogCustomizer
