plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

group = 'com.hms'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.spring.boot.starter.webmvc
    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.boot.starter.validation
    implementation libs.spring.boot.starter.security
    implementation libs.spring.boot.starter.data.jpa
    implementation libs.spring.boot.starter.flyway
    implementation libs.spring.boot.starter.session.jdbc // server-side sessions in PostgreSQL (ADR-0005, [E1-3])
    implementation libs.flyway.postgresql
    implementation libs.springdoc.openapi
    runtimeOnly libs.postgresql
    runtimeOnly libs.micrometer.registry.prometheus // /actuator/prometheus scrape endpoint (ADR-0014, [E0-7])

    testImplementation libs.spring.boot.starter.test
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Dev/staging seed data generator ([E2-4]). A separate source set, so it is never part of the application jar or of
// normal startup (and not subject to the module-boundary ArchUnit rules: it is tooling that drives every module's
// application services). Run with `./gradlew seedData` (see README).
sourceSets {
    seed {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    seedImplementation.extendsFrom implementation
    seedRuntimeOnly.extendsFrom runtimeOnly
}

tasks.register('seedData', JavaExec) {
    group = 'application'
    description = 'Seeds synthetic dev/staging data (idempotent). Refused unless profile dev/staging or HMS_ENV=dev|staging. ' +
            'Use --args="--large" for 100k patients, --args="--patients=N" for a custom count.'
    classpath = sourceSets.seed.runtimeClasspath
    mainClass = 'com.hms.seed.SeedApplication'
    // No default profile is injected: the environment must say dev (SPRING_PROFILES_ACTIVE=dev) or
    // HMS_ENV=dev|staging explicitly, otherwise the guard refuses.
}

// Test suites per ADR-0013: `test` (unit, no Docker), `integrationTest` (Testcontainers), `architectureTest` (ArchUnit).
testing {
    suites {
        test {
            useJUnitJupiter()
            dependencies {
                implementation sourceSets.seed.output
            }
        }

        integrationTest(JvmTestSuite) {
            dependencies {
                implementation project()
                implementation sourceSets.seed.output
                implementation libs.spring.boot.starter.test
                implementation libs.spring.boot.starter.webmvc.test
                implementation libs.spring.boot.testcontainers
                implementation libs.testcontainers.postgresql
                implementation libs.testcontainers.junit
            }
            targets.all {
                testTask.configure {
                    shouldRunAfter(test)
                    // Built-in field-encryption keys (ADR-0009) exist only for the dev/test profiles.
                    systemProperty 'spring.profiles.active', 'test'
                }
            }
        }

        architectureTest(JvmTestSuite) {
            dependencies {
                implementation project()
                implementation libs.archunit.junit5
            }
            targets.all {
                testTask.configure { shouldRunAfter(test) }
            }
        }
    }
}

// Test suites only see `project()`'s runtime classpath; give them the main compile classpath too.
configurations {
    integrationTestImplementation.extendsFrom implementation
    architectureTestImplementation.extendsFrom implementation
}


tasks.named('check') {
    dependsOn testing.suites.integrationTest, testing.suites.architectureTest, tasks.named('seedClasses')
}
