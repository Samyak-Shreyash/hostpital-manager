# Dev reverse proxy ([E0-3]). Actuator is deliberately not routed: health is checked inside the network.

# Login rate limit per client IP (api-design.md section 2, "public (rate limited)"). Complements the per-account
# lockout in the app ([E1-3]): lockout stops guessing one password, this slows spraying many accounts from one host.
# Sized for a clinic where all staff share one NAT address: ~20 people can log in at once (burst), then 30/min.
# The key is the TCP peer; behind another load balancer it must become the real client IP (ngx_http_realip_module).
# Access log without query strings: search parameters (name, phone, UHID) are PHI. Logs the path only.
log_format hms_no_query '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status '
                        '$body_bytes_sent $request_time rid=$request_id';

limit_req_zone $binary_remote_addr zone=login:1m rate=30r/m;
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log hms_no_query; # never $request/$args (PHI in query strings)

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/v1/auth/login {
        limit_req zone=login burst=20 nodelay;
        error_page 429 = @rate_limited;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # Same Problem+JSON shape and code as the backend's errors (api-design.md "Error model").
    location @rate_limited {
        default_type application/problem+json;
        add_header Retry-After 5 always;
        add_header X-Request-Id $request_id always;
        return 429 '{"type":"https://hms.example/problems/rate-limited","title":"Too Many Requests","status":429,"detail":"Too many login attempts from this network. Try again shortly.","code":"RATE_LIMITED","requestId":"$request_id"}';
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
