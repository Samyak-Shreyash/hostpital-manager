# Dev stack ([E0-3]): Postgres, API, reverse proxy. All values come from the repo-root .env (no defaults here).
# From the repo root:
#   cp .env.example .env    # then fill in every value
#   docker compose -f infra/compose/compose.yml --env-file .env up -d --build --wait
# App: http://localhost:${HMS_PROXY_PORT}  (only the proxy and Postgres publish ports, both on localhost)
name: hms

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${HMS_DB_NAME}
      # Admin superuser: only the init script and humans use it, never the API (ADR-0015).
      POSTGRES_USER: ${HMS_DB_ADMIN_USERNAME}
      POSTGRES_PASSWORD: ${HMS_DB_ADMIN_PASSWORD}
      # Read by ../docker/db-init/01-roles.sh to create hms_owner and hms_app on first start.
      HMS_DB_MIGRATION_PASSWORD: ${HMS_DB_MIGRATION_PASSWORD}
      HMS_DB_PASSWORD: ${HMS_DB_PASSWORD}
    ports:
      - "127.0.0.1:${HMS_DB_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/backend.Dockerfile
    # Listed explicitly so the admin credentials never reach the API. Inside the network the database
    # is the `db` service, and the healthcheck and proxy expect the API on 8080.
    environment:
      HMS_DB_URL: jdbc:postgresql://db:5432/${HMS_DB_NAME}  # container port, not HMS_DB_PORT (host side only)
      HMS_DB_USERNAME: ${HMS_DB_USERNAME}
      HMS_DB_PASSWORD: ${HMS_DB_PASSWORD}
      HMS_DB_MIGRATION_USERNAME: ${HMS_DB_MIGRATION_USERNAME}
      HMS_DB_MIGRATION_PASSWORD: ${HMS_DB_MIGRATION_PASSWORD}
      HMS_SERVER_PORT: "8080"
    depends_on:
      db:
        condition: service_healthy

  proxy:
    build:
      context: ../..
      dockerfile: infra/docker/proxy.Dockerfile
    ports:
      - "127.0.0.1:${HMS_PROXY_PORT}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
