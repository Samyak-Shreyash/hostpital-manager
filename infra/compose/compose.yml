# Dev stack ([E0-3]): Postgres, API, reverse proxy. All values come from the repo-root .env (no defaults here).
# From the repo root:
#   cp .env.example .env    # then fill in every value
#   infra/compose/up.sh     # reuses the existing database volume, creates it only on first run
# App: http://localhost:${HMS_PROXY_PORT}  (only the proxy and Postgres publish ports, both on localhost)
# Monitoring ([E0-7], opt-in): add `--profile monitoring` -> Grafana on http://localhost:${HMS_GRAFANA_PORT}
name: hms

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${HMS_DB_NAME}
      # Admin superuser: only the init script and humans use it, never the API (ADR-0015).
      POSTGRES_USER: ${HMS_DB_ADMIN_USERNAME}
      POSTGRES_PASSWORD: ${HMS_DB_ADMIN_PASSWORD}
      # Read by ../docker/db-init/01-roles.sh to create hms_owner and hms_app on first start.
      HMS_DB_MIGRATION_PASSWORD: ${HMS_DB_MIGRATION_PASSWORD}
      HMS_DB_PASSWORD: ${HMS_DB_PASSWORD}
    ports:
      - "127.0.0.1:${HMS_DB_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  # Logical backups of the dev database: one dump at start-up, then every HMS_BACKUP_INTERVAL_HOURS,
  # keeping the newest HMS_BACKUP_KEEP. Restore: infra/backup/restore.sh <dump>.
  db-backup:
    image: postgres:17-alpine
    environment:
      PGHOST: db
      PGDATABASE: ${HMS_DB_NAME}
      PGUSER: ${HMS_DB_ADMIN_USERNAME}
      PGPASSWORD: ${HMS_DB_ADMIN_PASSWORD}
      INTERVAL_HOURS: ${HMS_BACKUP_INTERVAL_HOURS:-6}
      KEEP: ${HMS_BACKUP_KEEP:-14}
    volumes:
      - ${HMS_BACKUP_DIR:-../../backups}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/hms-$$(date -u +%Y%m%dT%H%M%SZ).dump
          if pg_dump -Fc -f "$$f.part"; then mv "$$f.part" "$$f"; echo "backup: $$f"; else rm -f "$$f.part"; echo "backup FAILED" >&2; fi
          ls -1t /backups/hms-*.dump 2>/dev/null | tail -n +$$((KEEP + 1)) | xargs -r rm -f
          sleep $$((INTERVAL_HOURS * 3600))
        done
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/backend.Dockerfile
    # Listed explicitly so the admin credentials never reach the API. Inside the network the database
    # is the `db` service, and the healthcheck and proxy expect the API on 8080.
    environment:
      HMS_DB_URL: jdbc:postgresql://db:5432/${HMS_DB_NAME}  # container port, not HMS_DB_PORT (host side only)
      HMS_DB_USERNAME: ${HMS_DB_USERNAME}
      HMS_DB_PASSWORD: ${HMS_DB_PASSWORD}
      HMS_DB_MIGRATION_USERNAME: ${HMS_DB_MIGRATION_USERNAME}
      HMS_DB_MIGRATION_PASSWORD: ${HMS_DB_MIGRATION_PASSWORD}
      HMS_SERVER_PORT: "8080"
      # Dev stack: the 'dev' profile supplies public built-in field-encryption keys when these are empty (ADR-0009).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      HMS_FIELD_ENCRYPTION_KEYS: ${HMS_FIELD_ENCRYPTION_KEYS:-}
      HMS_ABHA_HMAC_KEY: ${HMS_ABHA_HMAC_KEY:-}
      # Optional first-run bootstrap ([E2-1]); empty = off. See .env.example and README "First organization".
      HMS_BOOTSTRAP_ORG_NAME: ${HMS_BOOTSTRAP_ORG_NAME:-}
      HMS_BOOTSTRAP_ADMIN_EMAIL: ${HMS_BOOTSTRAP_ADMIN_EMAIL:-}
      HMS_BOOTSTRAP_ORG_TIMEZONE: ${HMS_BOOTSTRAP_ORG_TIMEZONE:-}
      HMS_BOOTSTRAP_ADMIN_PASSWORD_FILE: ${HMS_BOOTSTRAP_ADMIN_PASSWORD_FILE:-}
    volumes:
      - bootstrap-secret:/var/lib/hms/bootstrap
    depends_on:
      db:
        condition: service_healthy

  proxy:
    build:
      context: ../..
      dockerfile: infra/docker/proxy.Dockerfile
    ports:
      - "127.0.0.1:${HMS_PROXY_PORT}:8080"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy

  grafana:
    profiles: [monitoring]
    image: grafana/grafana-oss:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${HMS_GRAFANA_ADMIN_USERNAME}
      GF_SECURITY_ADMIN_PASSWORD: ${HMS_GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:${HMS_GRAFANA_PORT}:3000"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  bootstrap-secret:
  # External so `down -v` never deletes the database; infra/compose/up.sh creates it only if missing.
  db-data:
    external: true
    name: ${HMS_DB_VOLUME:-hms-db-data}
  prometheus-data:
  grafana-data:
